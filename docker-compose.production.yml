name: ${COMPOSE_PROJECT_NAME:-cidadefacil}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      SESSION_COOKIE_SECURE: "true"
      PUBLIC_MUNICIPALITY_SLUG: ${PUBLIC_MUNICIPALITY_SLUG}
      AUDIT_IP_SALT: ${AUDIT_IP_SALT}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX}
      RATE_LIMIT_LOGIN_WINDOW_MS: ${RATE_LIMIT_LOGIN_WINDOW_MS}
      RATE_LIMIT_PUBLIC_CREATE_MAX: ${RATE_LIMIT_PUBLIC_CREATE_MAX}
      RATE_LIMIT_PUBLIC_CREATE_WINDOW_MS: ${RATE_LIMIT_PUBLIC_CREATE_WINDOW_MS}
      RATE_LIMIT_PUBLIC_QUERY_MAX: ${RATE_LIMIT_PUBLIC_QUERY_MAX}
      RATE_LIMIT_PUBLIC_QUERY_WINDOW_MS: ${RATE_LIMIT_PUBLIC_QUERY_WINDOW_MS}
      RATE_LIMIT_PUBLIC_UPLOAD_MAX: ${RATE_LIMIT_PUBLIC_UPLOAD_MAX}
      RATE_LIMIT_PUBLIC_UPLOAD_WINDOW_MS: ${RATE_LIMIT_PUBLIC_UPLOAD_WINDOW_MS}
      RATE_LIMIT_UPLOAD_MAX: ${RATE_LIMIT_UPLOAD_MAX}
      RATE_LIMIT_UPLOAD_WINDOW_MS: ${RATE_LIMIT_UPLOAD_WINDOW_MS}
      RATE_LIMIT_GEOCODE_MAX: ${RATE_LIMIT_GEOCODE_MAX}
      RATE_LIMIT_GEOCODE_WINDOW_MS: ${RATE_LIMIT_GEOCODE_WINDOW_MS}
      GEOCODING_BASE_URL: ${GEOCODING_BASE_URL}
      SLA_WORKER_INTERVAL_MS: ${SLA_WORKER_INTERVAL_MS:-60000}
      BACKUP_DIRECTORY: /app/backups
    volumes:
      - uploads:/app/storage/uploads
      - ./backups:/app/backups:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  sla-worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      SLA_WORKER_INTERVAL_MS: ${SLA_WORKER_INTERVAL_MS:-60000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

  backup-helper:
    image: alpine:3.22
    profiles: ["tools"]
    volumes:
      - uploads:/data:ro
      - ./backups:/backup

  restore-helper:
    image: alpine:3.22
    profiles: ["tools"]
    volumes:
      - uploads:/data

networks:
  internal:

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
